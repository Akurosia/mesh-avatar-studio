services:
  studio:
    image: ghcr.io/akurosia/mesh-avatar-studio:latest
    pull_policy: always
    init: true
    environment:
      STUDIO_ALLOWED_HOSTS: "${STUDIO_ALLOWED_HOSTS:-}"
    ports:
      - "127.0.0.1:${STUDIO_PORT:-5173}:5173"
    volumes:
      - type: bind
        source: ./projects
        target: /app/projects
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
